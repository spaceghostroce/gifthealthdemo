# Step 2: secret scanning with Gitleaks.
#
# Gitleaks reads every commit in the repo's history and looks for strings that
# are shaped like credentials: cloud keys, tokens, private keys, and generic
# "something_key = <high-entropy string>" patterns. If it finds any, the job
# fails, which turns the PR check red.
#
# Why scan the whole history and not just the new commits? A secret that was
# committed last month and "deleted" yesterday is still in git history, still
# visible to anyone who clones the repo, and still needs rotating.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    # Least privilege: this job only needs to read the code.
    permissions:
      contents: read

    steps:
      - name: Check out code (full history)
        uses: actions/checkout@v7
        with:
          # Default is a shallow clone of 1 commit. 0 means "all of it",
          # which Gitleaks needs to scan past commits.
          fetch-depth: 0

      - name: Install Gitleaks
        # Pinned to an exact version so the scan is reproducible. Bumping the
        # version is a deliberate, reviewable change rather than a surprise.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets
        # --redact  : print only part of each secret in the log, never the whole thing
        # --verbose : show each finding (file, line, rule, commit)
        # exit code 1 on findings is Gitleaks' default, which fails the job
        run: gitleaks git --redact --verbose --no-banner .
